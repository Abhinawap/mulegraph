# AMLworld HI-Small: accounts are nodes, transactions are the labelled edges (PR-D2).
#
#   uv run mulegraph run --config configs/amlworld_hi_small.yaml
#
# Temporal split by day, IBM's 0-5 / 6-7 / 8-17. Set dataset.max_days: 2 to develop
# on a small host; the truncated graph is cached under its own version.

dataset:
  name: amlworld
  version: hi_small

features:
  families: [fan, degree, scatter_gather]   # lc_cycle only once an hour batch is timed fast
  bins: [2, 4, 8, 16, 32]
  window: 24                                # hours; edge_time is the hour index
  cycle_len: 10
  vertex_stats: true
  num_threads: 8

split:
  regimes:
    - regime: temporal
      train_end: 5
      val: [6, 7]
      test: [8, 17]

models:
  - {name: xgb, features: base}             # amounts, currencies, format, hour of day
  - {name: xgb, features: base_gfp}
  # Edge head over learned account embeddings; neighbourhoods sampled by edge time (PR-F2).
  - name: sage
    features: base
    sampler: {kind: neighbor, fanout: [15, 10], batch_size: 4096}
    params: {epochs: 10, patience: 3}
  - name: sage
    features: base_gfp
    sampler: {kind: neighbor, fanout: [15, 10], batch_size: 4096}
    params: {epochs: 10, patience: 3}

seeds: [0, 1, 2]

eval:
  metrics: [f1, pr_auc, roc_auc, p_at_r50, p_at_r80]

mlflow:
  experiment: amlworld_hi_small

device: auto
