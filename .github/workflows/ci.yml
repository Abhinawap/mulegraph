name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The full grid never runs in CI; tests needing the real Elliptic++ files
      # are marked `elliptic` and skipped here.
      - name: Tests
        run: uv run pytest -m "not elliptic" --cov=mulegraph --cov-report=term-missing
