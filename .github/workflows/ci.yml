name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Keep the torch/CUDA wheels (~3 GB); pruning drops PyPI wheels and
          # leaves every run to re-download them.
          prune-cache: false

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The full grid never runs in CI; tests needing the real Elliptic++ files
      # are marked `elliptic` and skipped here.
      - name: Tests
        run: uv run pytest -m "not elliptic and not integrity" --cov=mulegraph --cov-report=term-missing

      - name: Smoke
        run: uv run mulegraph smoke

  # Plants each guarded bug in a copy of the package and runs its guard tests (~3 min wall on 6 workers).
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # As in `check`: keep the torch/CUDA wheels.
          prune-cache: false

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Planted-bug rows
        run: uv run pytest -m integrity -n auto
